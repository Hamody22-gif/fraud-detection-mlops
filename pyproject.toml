[project]
# The name of your project (lowercase, hyphens)
name = "fraud-detection"
# Version — we'll bump this as the project matures
version = "0.1.0"
description = "End-to-end MLOps fraud detection pipeline on the Sparkov dataset"
# The minimum Python version this project needs
requires-python = ">=3.12"
# Runtime libraries go here — empty for now, we'll add pandas etc. in Phase 1
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "seaborn>=0.13.2",
]
[tool.ruff]
# Max line length before ruff complains
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Which rule families to enforce. Each letter is a category:
#   E  = style errors        F  = real bugs (unused imports, undefined names)
#   I  = import sorting      N  = naming conventions
#   UP = modernize old syntax  B = likely-bug patterns  SIM = simplifiable code
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
# strict = the full set of strict type-checking flags. This is the
# "strict typing" signal most juniors never turn on.
strict = true
# Many ML libraries ship without type info; this stops mypy erroring on them
ignore_missing_imports = true

[tool.pytest.ini_options]
# Where pytest looks for tests
testpaths = ["tests"]
