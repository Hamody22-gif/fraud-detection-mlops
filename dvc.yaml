stages:
  featurize:
    cmd: python -m fraud_detection.featurize
    deps:
      - src/fraud_detection/featurize.py
      - src/fraud_detection/features.py
      - src/fraud_detection/data.py
      - src/fraud_detection/config.py
      - data/raw/fraudTrain.csv
      - data/raw/fraudTest.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m fraud_detection.train
    deps:
      - src/fraud_detection/train.py
      - src/fraud_detection/model.py
      - src/fraud_detection/preprocess.py
      - src/fraud_detection/config.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - models/xgboost.joblib
    metrics:
      - metrics.json:
          cache: false
